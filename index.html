<style>

/* =========================================================

body{

.market-name{

  gap:14px;

.panel-title{
  font-size:18px;

  margin-bottom:4px;

.window-size{

  font-size:13px;
  margin-bottom:12px;
}


/* =========================================================
   DIGIT GRID
   ========================================================= */

.digit-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.digit-card{
  background:#151a22;
  border:1px solid #252d39;
  border-radius:9px;
  padding:9px 4px;
  text-align:center;

}

.digit-number{
  font-size:18px;
  font-weight:bold;
}

.digit-percent{
  margin-top:4px;
  font-size:14px;
  color:#b9c1cc;
}


/* =========================================================
   RANKING COLORS
   ========================================================= */

.rank-green{
  border-color:#00d084;
  box-shadow:inset 0 0 0 1px #00d084;
}

.rank-blue{
  border-color:#2196f3;
  box-shadow:inset 0 0 0 1px #2196f3;
}

.rank-red{
  border-color:#ff3b30;
  box-shadow:inset 0 0 0 1px #ff3b30;
}

.rank-yellow{
  border-color:#ffd60a;
  box-shadow:inset 0 0 0 1px #ffd60a;
}


/* =========================================================
   RECENT DIGITS
   ========================================================= */

.recent-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.recent-grid{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:6px;
}

.recent-digit{
  background:#151a22;
  border:1px solid #252d39;
  border-radius:7px;
  text-align:center;
  padding:7px 2px;
  font-size:15px;
  font-weight:bold;
  min-width:0;
}

.recent-target{
  background:#39171b;
  border-color:#ff3b30;
  color:#ff6259;
}

.recent-normal{
  color:#00d084;
}

.small{
  color:#7f8997;
  font-size:12px;
  margin-top:8px;
}

.error-text{
  color:#ff6259;
  font-size:13px;
  margin-top:7px;
  word-break:break-word;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:750px){

  .analyzers{
    grid-template-columns:1fr;
  }

}

@media(max-width:700px){

  .recent-grid{
    grid-template-columns:repeat(9,1fr);
    gap:4px;
  }

  .recent-digit{
    padding:7px 1px;
    font-size:14px;
  }

}

<script>

/* =========================================================
   MANNUH TRADER
   SINGLE LEG
   DERIV PUBLIC MARKET DATA
   ========================================================= */


/* =========================================================
   WEBSOCKET
   ========================================================= */

const WS_URL =
  "wss://ws.binaryws.com/websockets/v3";


/* =========================================================
   SETTINGS
   ========================================================= */

const MAX_HISTORY = 3000;

const WINDOW_1000 = 1000;

const WINDOW_100 = 100;

const RECENT_COUNT = 72;


/* =========================================================
   STATE
   ========================================================= */

let ws = null;

let reconnectTimer = null;

let pingTimer = null;

let reconnectAttempt = 0;

let connectionGeneration = 0;

let selectedSymbol =
  document.getElementById("marketSelect").value;

let pipSize = 2;

let digitHistory = [];

let historyTimes = [];

let pendingLiveTicks = [];

let historyLoaded = false;

let currentMode = "OVER2";

let liveSubscriptionId = null;

let lastTickKey = "";


/* =========================================================
   DOM
   ========================================================= */

const marketSelect =
  document.getElementById(
    "marketSelect"
  );

const statusDot =
  document.getElementById(
    "statusDot"
  );

const statusText =
  document.getElementById(
    "statusText"
  );

const errorText =
  document.getElementById(
    "errorText"
  );

const livePrice =
  document.getElementById(
    "livePrice"
  );

const lastDigit =
  document.getElementById(
    "lastDigit"
  );

const marketName =
  document.getElementById(
    "marketName"
  );

const grid1000 =
  document.getElementById(
    "grid1000"
  );

const grid100 =
  document.getElementById(
    "grid100"
  );

const recentGrid =
  document.getElementById(
    "recentGrid"
  );

const window1000 =
  document.getElementById(
    "window1000"
  );

const window100 =
  document.getElementById(
    "window100"
  );

const over2Btn =
  document.getElementById(
    "over2Btn"
  );

const under7Btn =
  document.getElementById(
    "under7Btn"
  );


/* =========================================================
   MARKET NAMES
   ========================================================= */

const MARKET_NAMES = {

  "1HZ10V":
    "Volatility 10 (1s) Index",

  "1HZ25V":
    "Volatility 25 (1s) Index",

  "1HZ50V":
    "Volatility 50 (1s) Index",

  "1HZ75V":
    "Volatility 75 (1s) Index",

  "1HZ100V":
    "Volatility 100 (1s) Index",

  "R_10":
    "Volatility 10 Index",

  "R_25":
    "Volatility 25 Index",

  "R_50":
    "Volatility 50 Index",

  "R_75":
    "Volatility 75 Index",

  "R_100":
    "Volatility 100 Index"

};


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  type,
  text
){

  statusDot.className =
    "dot";

  if(
    type === "green"
  ){

    statusDot.classList.add(
      "green"
    );

  }

  if(
    type === "red"
  ){

    statusDot.classList.add(
      "red"
    );

  }

  if(
    type === "yellow"
  ){

    statusDot.classList.add(
      "yellow"
    );

  }

  statusText.textContent =
    text;

}


function showError(
  message
){

  errorText.textContent =
    message || "";

}


/* =========================================================
   MARKET NAME
   ========================================================= */

function updateMarketName(){

  marketName.textContent =
    MARKET_NAMES[
      selectedSymbol
    ] ||
    selectedSymbol;

}


/* =========================================================
   LAST DIGIT
   ========================================================= */

function getLastDigit(
  price
){

  const number =
    Number(price);

  if(
    !Number.isFinite(number)
  ){

    return null;

  }


  let fixed;

  try{

    fixed =
      number.toFixed(
        pipSize
      );

  }catch(error){

    fixed =
      String(number);

  }


  const digits =
    fixed.replace(
      /\D/g,
      ""
    );


  if(
    !digits.length
  ){

    return null;

  }


  return Number(
    digits[
      digits.length - 1
    ]
  );

}


/* =========================================================
   COUNT DIGITS
   ========================================================= */

function countDigits(
  digits
){

  const counts =
    Array(10).fill(0);


  for(
    const digit of digits
  ){

    if(
      Number.isInteger(digit) &&
      digit >= 0 &&
      digit <= 9
    ){

      counts[digit]++;

    }

  }


  return counts;

}


/* =========================================================
   RANKING
   ========================================================= */

function getRankingClasses(
  counts
){

  const indexes =
    Array.from(
      {length:10},
      (_,i)=>i
    );


  const descending =
    [...indexes].sort(
      (a,b)=>{

        if(
          counts[b] !==
          counts[a]
        ){

          return (
            counts[b] -
            counts[a]
          );

        }

        return a - b;

      }
    );


  const ascending =
    [...indexes].sort(
      (a,b)=>{

        if(
          counts[a] !==
          counts[b]
        ){

          return (
            counts[a] -
            counts[b]
          );

        }

        return a - b;

      }
    );


  const classes =
    Array(10).fill("");


  classes[
    descending[0]
  ] =
    "rank-green";


  classes[
    descending[1]
  ] =
    "rank-blue";


  classes[
    ascending[0]
  ] =
    "rank-red";


  classes[
    ascending[1]
  ] =
    "rank-yellow";


  return classes;

}


/* =========================================================
   ANALYZER
   ========================================================= */

function renderAnalyzer(
  digits,
  grid,
  windowLabel,
  expectedSize
){

  grid.innerHTML =
    "";


  if(
    digits.length <
    expectedSize
  ){

    windowLabel.textContent =
      "Loading latest " +
      expectedSize.toLocaleString() +
      "...";

    return;

  }


  const windowDigits =
    digits.slice(
      -expectedSize
    );


  const counts =
    countDigits(
      windowDigits
    );


  const ranking =
    getRankingClasses(
      counts
    );


  for(
    let digit = 0;
    digit <= 9;
    digit++
  ){

    const percentage =
      (
        counts[digit] /
        expectedSize
      ) *
      100;


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "digit-card " +
      ranking[digit];


    const number =
      document.createElement(
        "div"
      );


    number.className =
      "digit-number";


    number.textContent =
      digit;


    const percent =
      document.createElement(
        "div"
      );


    percent.className =
      "digit-percent";


    percent.textContent =
      percentage.toFixed(1) +
      "%";


    card.appendChild(
      number
    );

    card.appendChild(
      percent
    );

    grid.appendChild(
      card
    );

  }


  windowLabel.textContent =
    expectedSize.toLocaleString() +
    " / " +
    expectedSize.toLocaleString() +
    " ticks";

}


/* =========================================================
   TARGET DIGITS
   ========================================================= */

function isTargetDigit(
  digit
){

  if(
    currentMode ===
    "OVER2"
  ){

    return (
      digit === 0 ||
      digit === 1 ||
      digit === 2
    );

  }


  if(
    currentMode ===
    "UNDER7"
  ){

    return (
      digit === 7 ||
      digit === 8 ||
      digit === 9
    );

  }


  return false;

}


/* =========================================================
   RECENT DIGITS
   ========================================================= */

function renderRecentDigits(){

  recentGrid.innerHTML =
    "";


  const recent =
    digitHistory
      .slice(
        -RECENT_COUNT
      )
      .reverse();


  for(
    let i = 0;
    i < RECENT_COUNT;
    i++
  ){

    const box =
      document.createElement(
        "div"
      );


    box.className =
      "recent-digit";


    const digit =
      recent[i];


    if(
      digit === undefined
    ){

      box.textContent =
        "";

      recentGrid.appendChild(
        box
      );

      continue;

    }


    box.textContent =
      digit;


    if(
      isTargetDigit(
        digit
      )
    ){

      box.classList.add(
        "recent-target"
      );

    }else{

      box.classList.add(
        "recent-normal"
      );

    }


    recentGrid.appendChild(
      box
    );

  }

}


/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function renderAll(){

  renderAnalyzer(
    digitHistory,
    grid1000,
    window1000,
    WINDOW_1000
  );


  renderAnalyzer(
    digitHistory,
    grid100,
    window100,
    WINDOW_100
  );


  renderRecentDigits();

}


/* =========================================================
   RESET DATA
   ========================================================= */

function resetData(){

  digitHistory = [];

  historyTimes = [];

  pendingLiveTicks = [];

  historyLoaded = false;

  liveSubscriptionId = null;

  lastTickKey = "";


  livePrice.textContent =
    "--";

  lastDigit.textContent =
    "--";


  grid1000.innerHTML =
    "";

  grid100.innerHTML =
    "";

  recentGrid.innerHTML =
    "";


  window1000.textContent =
    "Loading latest 1,000...";

  window100.textContent =
    "Loading latest 100...";

}


/* =========================================================
   ADD TICK TO 3,000 HISTORY
   ========================================================= */

function addTickToHistory(
  digit,
  epoch
){

  if(
    !Number.isInteger(digit) ||
    digit < 0 ||
    digit > 9
  ){

    return;

  }


  digitHistory.push(
    digit
  );


  historyTimes.push(
    Number(epoch) || 0
  );


  while(
    digitHistory.length >
    MAX_HISTORY
  ){

    digitHistory.shift();

    historyTimes.shift();

  }

}


/* =========================================================
   TICK KEY
   ========================================================= */

function makeTickKey(
  quote,
  epoch
){

  return (
    String(quote) +
    "|" +
    String(epoch)
  );

}


/* =========================================================
   APPLY LIVE TICK
   ========================================================= */

function applyLiveTick(
  quote,
  epoch
){

  const digit =
    getLastDigit(
      quote
    );


  if(
    digit === null
  ){

    return;

  }


  const tickKey =
    makeTickKey(
      quote,
      epoch
    );


  if(
    tickKey ===
    lastTickKey
  ){

    return;

  }


  lastTickKey =
    tickKey;


  livePrice.textContent =
    Number(quote).toFixed(
      pipSize
    );


  lastDigit.textContent =
    digit;


  addTickToHistory(
    digit,
    epoch
  );


  renderAll();

}


/* =========================================================
   PROCESS HISTORY
   ========================================================= */

function processHistory(
  data
){

  if(
    !data.history ||
    !Array.isArray(
      data.history.prices
    )
  ){

    throw new Error(
      "Deriv returned no tick history."
    );

  }


  const prices =
    data.history.prices;


  const times =
    Array.isArray(
      data.history.times
    )
      ? data.history.times
      : [];


  if(
    Number.isFinite(
      Number(data.pip_size)
    )
  ){

    pipSize =
      Number(
        data.pip_size
      );

  }


  digitHistory = [];

  historyTimes = [];


  for(
    let i = 0;
    i < prices.length;
    i++
  ){

    const digit =
      getLastDigit(
        prices[i]
      );


    if(
      digit === null
    ){

      continue;

    }


    addTickToHistory(
      digit,
      times[i]
    );

  }


  if(
    digitHistory.length <
    WINDOW_1000
  ){

    throw new Error(
      "Only " +
      digitHistory.length +
      " usable ticks were received. 1,000 ticks are required."
    );

  }


  historyLoaded =
    true;


  renderAll();


  setStatus(
    "green",
    "Connected to Deriv — live ticks"
  );


  showError("");


  /*
     Process ticks that arrived
     while history was loading.
  */

  if(
    pendingLiveTicks.length
  ){

    const pending =
      pendingLiveTicks
        .slice()
        .sort(
          (a,b)=>
            Number(a.epoch) -
            Number(b.epoch)
        );


    for(
      const item of pending
    ){

      applyLiveTick(
        item.quote,
        item.epoch
      );

    }

  }


  pendingLiveTicks = [];

}


/* =========================================================
   SEND HISTORY REQUEST
   ========================================================= */

function requestHistory(){

  if(
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ){

    return;

  }


  const request = {

    ticks_history:
      selectedSymbol,

    end:
      "latest",

    count:
      MAX_HISTORY,

    style:
      "ticks",

    req_id:
      1001

  };


  try{

    ws.send(
      JSON.stringify(
        request
      )
    );

  }catch(error){

    showError(
      "Could not request tick history."
    );

  }

}


/* =========================================================
   SUBSCRIBE TO LIVE TICKS
   ========================================================= */

function subscribeLiveTicks(){

  if(
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ){

    return;

  }


  const request = {

    ticks:
      selectedSymbol,

    subscribe:
      1,

    req_id:
      1002

  };


  try{

    ws.send(
      JSON.stringify(
        request
      )
    );

  }catch(error){

    showError(
      "Could not subscribe to live ticks."
    );

  }

}


/* =========================================================
   MESSAGE HANDLER
   ========================================================= */

function handleMessage(
  event
){

  let data;


  try{

    data =
      JSON.parse(
        event.data
      );

  }catch(error){

    return;

  }


  /* =======================================================
     API ERROR
     ======================================================= */

  if(
    data.error
  ){

    const message =
      data.error.message ||
      data.error.code ||
      "Deriv API error";


    setStatus(
      "red",
      "Deriv API error"
    );


    showError(
      message
    );


    return;

  }


  /* =======================================================
     HISTORY
     ======================================================= */

  if(
    data.msg_type ===
    "history"
  ){

    try{

      processHistory(
        data
      );

    }catch(error){

      historyLoaded =
        false;


      setStatus(
        "red",
        "History error"
      );


      showError(
        error.message
      );

    }


    return;

  }


  /* =======================================================
     LIVE TICK
     ======================================================= */

  if(
    data.msg_type ===
    "tick"
  ){

    if(
      !data.tick
    ){

      return;

    }


    const tick =
      data.tick;


    if(
      Number.isFinite(
        Number(
          tick.pip_size
        )
      )
    ){

      pipSize =
        Number(
          tick.pip_size
        );

    }


    if(
      !historyLoaded
    ){

      pendingLiveTicks.push({

        quote:
          tick.quote,

        epoch:
          tick.epoch

      });


      return;

    }


    applyLiveTick(
      tick.quote,
      tick.epoch
    );


    if(
      data.subscription &&
      data.subscription.id
    ){

      liveSubscriptionId =
        data.subscription.id;

    }


    return;

  }


  /* =======================================================
     SUBSCRIPTION CONFIRMATION
     ======================================================= */

  if(
    data.subscription &&
    data.subscription.id
  ){

    liveSubscriptionId =
      data.subscription.id;

  }

}


/* =========================================================
   PING
   ========================================================= */

function startPing(){

  stopPing();


  pingTimer =
    setInterval(
      function(){

        if(
          ws &&
          ws.readyState ===
          WebSocket.OPEN
        ){

          try{

            ws.send(
              JSON.stringify({
                ping:1,
                req_id:9001
              })
            );

          }catch(error){}

        }

      },
      30000
    );

}


function stopPing(){

  if(
    pingTimer
  ){

    clearInterval(
      pingTimer
    );

    pingTimer =
      null;

  }

}


/* =========================================================
   CLOSE OLD SUBSCRIPTION
   ========================================================= */

function forgetCurrentSubscription(){

  if(
    ws &&
    ws.readyState ===
    WebSocket.OPEN &&
    liveSubscriptionId
  ){

    try{

      ws.send(
        JSON.stringify({

          forget:
            liveSubscriptionId,

          req_id:
            3001

        })
      );

    }catch(error){}

  }

}


/* =========================================================
   CONNECT
   ========================================================= */

function connect(){

  connectionGeneration++;

  const thisGeneration =
    connectionGeneration;


  if(
    reconnectTimer
  ){

    clearTimeout(
      reconnectTimer
    );

    reconnectTimer =
      null;

  }


  if(
    ws
  ){

    try{

      forgetCurrentSubscription();

    }catch(error){}


    try{

      ws.close();

    }catch(error){}

  }


  stopPing();


  resetData();


  setStatus(
    "yellow",
    "Connecting to Deriv..."
  );


  showError("");


  updateMarketName();


  try{

    ws =
      new WebSocket(
        WS_URL
      );

  }catch(error){

    setStatus(
      "red",
      "Connection error"
    );

    showError(
      error.message
    );

    scheduleReconnect(
      thisGeneration
    );

    return;

  }


  ws.onopen =
    function(){

      if(
        thisGeneration !==
        connectionGeneration
      ){

        return;

      }


      reconnectAttempt =
        0;


      setStatus(
        "yellow",
        "Connected — loading latest 3,000 ticks..."
      );


      showError("");


      startPing();


      /*
        Subscribe first so live ticks are not
        missed while the historical request loads.
      */

      subscribeLiveTicks();


      requestHistory();

    };


  ws.onmessage =
    function(event){

      if(
        thisGeneration !==
        connectionGeneration
      ){

        return;

      }


      handleMessage(
        event
      );

    };


  ws.onerror =
    function(){

      if(
        thisGeneration !==
        connectionGeneration
      ){

        return;

      }


      setStatus(
        "red",
        "Connection error"
      );

    };


  ws.onclose =
    function(){

      if(
        thisGeneration !==
        connectionGeneration
      ){

        return;

      }


      stopPing();

      liveSubscriptionId =
        null;

      historyLoaded =
        false;


      setStatus(
        "yellow",
        "Disconnected — reconnecting..."
      );


      scheduleReconnect(
        thisGeneration
      );

    };

}


/* =========================================================
   RECONNECT
   ========================================================= */

function scheduleReconnect(
  generation
){

  if(
    generation !==
    connectionGeneration
  ){

    return;

  }


  if(
    reconnectTimer
  ){

    return;

  }


  reconnectAttempt++;


  const delay =
    Math.min(
      15000,
      1000 *
      Math.pow(
        1.5,
        reconnectAttempt - 1
      )
    );


  reconnectTimer =
    setTimeout(
      function(){

        reconnectTimer =
          null;


        if(
          generation !==
          connectionGeneration
        ){

          return;

        }


        connect();

      },
      delay
    );

}
