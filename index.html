<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mannuh Trader</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#05070b;
  color:#f2f2f2;
  font-family:Arial,Helvetica,sans-serif
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:15px
}

h1{
  text-align:center;
  margin:5px 0 15px;
  font-size:27px
}

.top-panel,.panel{
  background:#0d1118;
  border:1px solid #202734;
  border-radius:12px;
  padding:15px;
  margin-bottom:14px
}

.market-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap
}

select{
  background:#151b24;
  color:white;
  border:1px solid #303947;
  border-radius:8px;
  padding:10px;
  font-size:15px;
  flex:1;
  min-width:180px
}

.status-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
  font-size:14px
}

.status{
  display:flex;
  align-items:center;
  gap:7px
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#777
}

.dot.green{
  background:#00d084;
  box-shadow:0 0 8px #00d084
}

.dot.red{
  background:#ff3b30;
  box-shadow:0 0 8px #ff3b30
}

.dot.yellow{
  background:#ffd60a;
  box-shadow:0 0 8px #ffd60a
}

.market-info{
  text-align:center;
  padding:10px 0
}

.market-name{
  font-size:15px;
  color:#9aa4b2
}

.price{
  font-size:30px;
  font-weight:bold;
  margin-top:5px
}

.last-digit{
  margin-top:3px;
  font-size:16px;
  color:#9aa4b2
}

.modes{
  display:flex;
  gap:10px;
  margin-bottom:15px
}

.mode-btn{
  flex:1;
  padding:11px;
  border-radius:8px;
  border:1px solid #343d4d;
  background:#141a23;
  color:#ddd;
  font-weight:bold;
  cursor:pointer
}

.mode-btn.active{
  background:#222b38;
  border-color:#7d8796;
  color:white
}

.analyzers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.panel-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:4px
}

.window-size{
  color:#8993a3;
  font-size:13px;
  margin-bottom:12px
}

.digit-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.digit-card{
  background:#151a22;
  border:1px solid #252d39;
  border-radius:9px;
  padding:9px 4px;
  text-align:center
}

.digit-number{
  font-size:18px;
  font-weight:bold
}

.digit-percent{
  margin-top:4px;
  font-size:14px;
  color:#b9c1cc
}

.rank-green{
  border-color:#00d084;
  box-shadow:inset 0 0 0 1px #00d084
}

.rank-blue{
  border-color:#2196f3;
  box-shadow:inset 0 0 0 1px #2196f3
}

.rank-red{
  border-color:#ff3b30;
  box-shadow:inset 0 0 0 1px #ff3b30
}

.rank-yellow{
  border-color:#ffd60a;
  box-shadow:inset 0 0 0 1px #ffd60a
}

.recent-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px
}

.recent-grid{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:6px
}

.recent-digit{
  background:#151a22;
  border:1px solid #252d39;
  border-radius:7px;
  text-align:center;
  padding:7px 2px;
  font-size:15px;
  font-weight:bold
}

.recent-target{
  background:#39171b;
  border-color:#ff3b30;
  color:#ff6259
}

.recent-normal{
  color:#00d084
}

.small{
  color:#7f8997;
  font-size:12px;
  margin-top:8px
}

.error-text{
  color:#ff6259;
  font-size:13px;
  margin-top:7px;
  word-break:break-word
}

@media(max-width:750px){
  .analyzers{
    grid-template-columns:1fr
  }
}

@media(max-width:700px){
  .recent-grid{
    grid-template-columns:repeat(9,1fr);
    gap:4px
  }
}
</style>
</head>

<body>

<div class="container">

<h1>MANNUH TRADER</h1>

<div class="top-panel">

<div class="market-row">

<select id="marketSelect">

<option value="1HZ10V">Volatility 10 (1s) Index</option>
<option value="1HZ25V">Volatility 25 (1s) Index</option>
<option value="1HZ50V">Volatility 50 (1s) Index</option>
<option value="1HZ75V">Volatility 75 (1s) Index</option>
<option value="1HZ100V" selected>Volatility 100 (1s) Index</option>

<option value="R_10">Volatility 10 Index</option>
<option value="R_25">Volatility 25 Index</option>
<option value="R_50">Volatility 50 Index</option>
<option value="R_75">Volatility 75 Index</option>
<option value="R_100">Volatility 100 Index</option>

</select>

</div>

<div class="status-row">

<div class="status">
<span id="statusDot" class="dot yellow"></span>
<span id="statusText">Connecting to Deriv...</span>
</div>

<div>
Stored ticks: <strong>3,000</strong>
</div>

</div>

<div id="errorText" class="error-text"></div>

<div class="market-info">

<div class="market-name" id="marketName">
Volatility 100 (1s) Index
</div>

<div class="price" id="livePrice">
--
</div>

<div class="last-digit">
Last digit: <strong id="lastDigit">--</strong>
</div>

</div>

</div>


<div class="panel">

<div class="modes">

<button id="over2Btn" class="mode-btn active">
OVER 2
</button>

<button id="under7Btn" class="mode-btn">
UNDER 7
</button>

</div>

</div>


<div class="analyzers">

<div class="panel">

<div class="panel-title">
1,000 TICK ANALYZER
</div>

<div id="window1000" class="window-size">
Loading latest 1,000...
</div>

<div id="grid1000" class="digit-grid"></div>

</div>


<div class="panel">

<div class="panel-title">
100 TICK ANALYZER
</div>

<div id="window100" class="window-size">
Loading latest 100...
</div>

<div id="grid100" class="digit-grid"></div>

</div>

</div>


<div class="panel">

<div class="recent-title">
Recent Digits
</div>

<div id="recentGrid" class="recent-grid"></div>

<div class="small">
Newest digit appears on the left.
</div>

</div>

</div>


<script>

/* =========================================================
   DERIV MARKET DATA WEBSOCKET
   ========================================================= */

const WS_URL =
  "wss://ws.binaryws.com/websockets/v3";


/* =========================================================
   SETTINGS
   ========================================================= */

const MAX_HISTORY = 3000;

const WINDOW_1000 = 1000;

const WINDOW_100 = 100;

const RECENT_COUNT = 72;


/* =========================================================
   STATE
   ========================================================= */

let ws = null;

let reconnectTimer = null;

let pingTimer = null;

let reconnectAttempt = 0;

let selectedSymbol =
  document.getElementById("marketSelect").value;

let pipSize = 2;

let digitHistory = [];

let historyTimes = [];

let pendingLiveTicks = [];

let historyLoaded = false;

let currentMode = "OVER2";

let liveSubscriptionId = null;


/* =========================================================
   DOM
   ========================================================= */

const marketSelect =
  document.getElementById("marketSelect");

const statusDot =
  document.getElementById("statusDot");

const statusText =
  document.getElementById("statusText");

const errorText =
  document.getElementById("errorText");

const livePrice =
  document.getElementById("livePrice");

const lastDigit =
  document.getElementById("lastDigit");

const marketName =
  document.getElementById("marketName");

const grid1000 =
  document.getElementById("grid1000");

const grid100 =
  document.getElementById("grid100");

const recentGrid =
  document.getElementById("recentGrid");

const window1000 =
  document.getElementById("window1000");

const window100 =
  document.getElementById("window100");

const over2Btn =
  document.getElementById("over2Btn");

const under7Btn =
  document.getElementById("under7Btn");


/* =========================================================
   MARKET NAMES
   ========================================================= */

const MARKET_NAMES = {

  "1HZ10V":
    "Volatility 10 (1s) Index",

  "1HZ25V":
    "Volatility 25 (1s) Index",

  "1HZ50V":
    "Volatility 50 (1s) Index",

  "1HZ75V":
    "Volatility 75 (1s) Index",

  "1HZ100V":
    "Volatility 100 (1s) Index",

  "R_10":
    "Volatility 10 Index",

  "R_25":
    "Volatility 25 Index",

  "R_50":
    "Volatility 50 Index",

  "R_75":
    "Volatility 75 Index",

  "R_100":
    "Volatility 100 Index"

};


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(type, text){

  statusDot.className = "dot";

  if(type === "green"){
    statusDot.classList.add("green");
  }

  if(type === "red"){
    statusDot.classList.add("red");
  }

  if(type === "yellow"){
    statusDot.classList.add("yellow");
  }

  statusText.textContent = text;

}


function showError(message){

  errorText.textContent =
    message || "";

}


/* =========================================================
   MARKET NAME
   ========================================================= */

function updateMarketName(){

  marketName.textContent =
    MARKET_NAMES[selectedSymbol] ||
    selectedSymbol;

}


/* =========================================================
   LAST DIGIT
   ========================================================= */

function getLastDigit(price){

  const number =
    Number(price);

  if(!Number.isFinite(number)){
    return null;
  }

  const fixed =
    number.toFixed(pipSize);

  const digits =
    fixed.replace(/\D/g, "");

  if(!digits.length){
    return null;
  }

  return Number(
    digits[digits.length - 1]
  );

}


/* =========================================================
   COUNT DIGITS
   ========================================================= */

function countDigits(digits){

  const counts =
    Array(10).fill(0);

  for(const digit of digits){

    if(
      Number.isInteger(digit) &&
      digit >= 0 &&
      digit <= 9
    ){

      counts[digit]++;

    }

  }

  return counts;

}


/* =========================================================
   RANKING
   ========================================================= */

function getRankingClasses(counts){

  const indexes =
    Array.from(
      {length:10},
      (_,i)=>i
    );


  const descending =
    [...indexes].sort(
      (a,b)=>{

        if(
          counts[b] !==
          counts[a]
        ){

          return (
            counts[b] -
            counts[a]
          );

        }

        return a - b;

      }
    );


  const ascending =
    [...indexes].sort(
      (a,b)=>{

        if(
          counts[a] !==
          counts[b]
        ){

          return (
            counts[a] -
            counts[b]
          );

        }

        return a - b;

      }
    );


  const classes =
    Array(10).fill("");


  classes[
    descending[0]
  ] = "rank-green";


  classes[
    descending[1]
  ] = "rank-blue";


  classes[
    ascending[0]
  ] = "rank-red";


  classes[
    ascending[1]
  ] = "rank-yellow";


  return classes;

}


/* =========================================================
   ANALYZER
   ========================================================= */

function renderAnalyzer(
  digits,
  grid,
  windowLabel,
  expectedSize
){

  grid.innerHTML = "";


  if(
    digits.length <
    expectedSize
  ){

    windowLabel.textContent =
      "Loading latest " +
      expectedSize.toLocaleString() +
      "...";

    return;

  }


  const windowDigits =
    digits.slice(
      -expectedSize
    );


  const counts =
    countDigits(
      windowDigits
    );


  const ranking =
    getRankingClasses(
      counts
    );


  for(
    let digit = 0;
    digit <= 9;
    digit++
  ){

    const percentage =
      (
        counts[digit] /
        expectedSize
      ) * 100;


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "digit-card " +
      ranking[digit];


    const number =
      document.createElement(
        "div"
      );


    number.className =
      "digit-number";


    number.textContent =
      digit;


    const percent =
      document.createElement(
        "div"
      );


    percent.className =
      "digit-percent";


    percent.textContent =
      percentage.toFixed(1) +
      "%";


    card.appendChild(number);

    card.appendChild(percent);

    grid.appendChild(card);

  }


  windowLabel.textContent =
    expectedSize.toLocaleString() +
    " / " +
    expectedSize.toLocaleString() +
    " ticks";

}


/* =========================================================
   TARGET DIGITS
   ========================================================= */

function isTargetDigit(digit){

  if(
    currentMode ===
    "OVER2"
  ){

    return (
      digit === 0 ||
      digit === 1 ||
      digit === 2
    );

  }


  if(
    currentMode ===
    "UNDER7"
  ){

    return (
      digit === 7 ||
      digit === 8 ||
      digit === 9
    );

  }


  return false;

}


/* =========================================================
   RECENT DIGITS
   ========================================================= */

function renderRecentDigits(){

  recentGrid.innerHTML = "";


  const recent =
    digitHistory
      .slice(-RECENT_COUNT)
      .reverse();


  for(
    let i = 0;
    i < RECENT_COUNT;
    i++
  ){

    const box =
      document.createElement(
        "div"
      );


    box.className =
      "recent-digit";


    const digit =
      recent[i];


    if(
      digit === undefined
    ){

      box.textContent =
        "";

      recentGrid.appendChild(
        box
      );

      continue;

    }


    box.textContent =
      digit;


    if(
      isTargetDigit(digit)
    ){

      box.classList.add(
        "recent-target"
      );

    }else{

      box.classList.add(
        "recent-normal"
      );

    }


    recentGrid.appendChild(
      box
    );

  }

}


/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function renderAll(){

  renderAnalyzer(
    digitHistory,
    grid1000,
    window1000,
    WINDOW_1000
  );


  renderAnalyzer(
    digitHistory,
    grid100,
    window100,
    WINDOW_100
  );


  renderRecentDigits();

}


/* =========================================================
   RESET DISPLAY
   ========================================================= */

function resetData(){

  digitHistory = [];

  historyTimes = [];

  pendingLiveTicks = [];

  historyLoaded = false;

  liveSubscriptionId = null;


  livePrice.textContent =
    "--";

  lastDigit.textContent =
    "--";


  grid1000.innerHTML =
    "";

  grid100.innerHTML =
    "";

  recentGrid.innerHTML =
    "";


  window1000.textContent =
    "Loading latest 1,000...";


  window100.textContent =
    "Loading latest 100...";

}


/* =========================================================
   ADD TICK TO ROLLING 3,000
   ========================================================= */

function addTickToHistory(
  digit,
  epoch
){

  if(
    !Number.isInteger(digit) ||
    digit < 0 ||
    digit > 9
  ){

    return;

  }


  digitHistory.push(
    digit
  );


  historyTimes.push(
    Number(epoch) || 0
  );


  while(
    digitHistory.length >
    MAX_HISTORY
  ){

    digitHistory.shift();

    historyTimes.shift();

  }

}


/* =========================================================
   PROCESS HISTORICAL DATA
   ========================================================= */

function processHistory(data){

  if(
    !data.history ||
    !Array.isArray(
      data.history.prices
    )
  ){

    throw new Error(
      "Deriv returned no tick history."
    );

  }


  const prices =
    data.history.prices;


  const times =
    Array.isArray(
      data.history.times
    )
      ? data.history.times
      : [];


  if(
    Number.isFinite(
      Number(data.pip_size)
    )
  ){

    pipSize =
      Number(data.pip_size);

  }


  digitHistory = [];

  historyTimes = [];


  for(
    let i = 0;
    i < prices.length;
    i++
  ){

    const digit =
      getLastDigit(
        prices[i]
      );


    if(
      digit === null
    ){

      continue;

    }


    addTickToHistory(
      digit,
      times[i]
    );

  }


  if(
    digitHistory.length <
    WINDOW_1000
  ){

    throw new Error(
      "Deriv returned only " +
      digitHistory.length +
      " usable ticks. The analyzer needs at least 1,000."
    );

  }


  historyLoaded =
    true;


  renderAll();


  setStatus(
    "green",
    "Connected to Deriv — live ticks"
  );


  showError("");


  /*
    Process any live ticks that arrived
    while the 3,000-tick history loaded.
  */

  if(
    pendingLiveTicks.length
  ){

    const pending =
      pendingLiveTicks
        .slice()
        .sort(
          (a,b)=>
            Number(a.epoch) -
            Number(b.epoch)
        );


    for(
      const item of pending
    ){

      const lastHistoryTime =
        historyTimes.length
          ? Number(
              historyTimes[
                historyTimes.length - 1
              ]
            )
          : 0;


      if(
        Number(item.epoch) >
        lastHistoryTime
      ){

        applyLiveTick(
          item.quote,
          item.epoch
        );

      }

    }

  }


  pendingLiveTicks = [];

}


/* =========================================================
   PROCESS LIVE TICK
   ========================================================= */

function applyLiveTick(
  quote,
  epoch
){

  const digit =
    getLastDigit(
      quote
    );


  if(
    digit === null
  ){

    return;

  }


  livePrice.textContent =
    Number(quote).toFixed(
      pipSize
    );


  lastDigit.textContent =
    digit;


  addTickToHistory(
    digit,
    epoch
  );


  renderAll();

}


/* =========================================================
   MESSAGE HANDLER
   ========================================================= */

function handleMessage(event){

  let data;


  try{

    data =
      JSON.parse(
        event.data
      );

  }catch(error){

    return;

  }


  /*
    API ERROR
  */

  if(
    data.error
  ){

    const message =
      data.error.message ||
      data.error.code ||
      "Deriv API error";


    setStatus(
      "red",
      "Deriv API error"
    );


    showError(
      message
    );


    return;

  }


  /*
    HISTORY
  */

  if(
    data.msg_type ===
    "history"
  ){

    try{

      processHistory(
        data
      );

    }catch(error){

      historyLoaded =
        false;


      setStatus(
        "red",
        "History error"
      );


      showError(
        error.message
      );

    }


    return;

  }


  /*
    LIVE TICK
  */

  if(
    data.msg_type ===
    "tick"
  ){

    if(
      !data.tick
    ){

      return;

    }


    const tick =
      data.tick;


    if(
      Number.isFinite(
        Number(tick.pip_size)
      )
    ){

      pipSize =
        Number(
          tick.pip_size
        );

    }


    if(
      !historyLoaded
    ){

      pendingLiveTicks.push({

        quote:
          tick.quote,

        epoch:
          tick.epoch

      });


      return;

    }


    applyLiveTick(
      tick.quote,
      tick.epoch
    );


    if(
      data.subscription &&
      data.subscription.id
    ){

      liveSubscriptionId =
        data.subscription.id;

    }


    return;

  }


  /*
    SUBSCRIPTION CONFIRMATION
  */

  if(
    data.subscription &&
    data.subscription.id
  ){

    liveSubscriptionId =
      data.subscription.id;

  }

}


/* =========================================================
   KEEP CONNECTION ALIVE
   ========================================================= */

function startPing(){

  stopPing();


  pingTimer =
    setInterval(
      function(){

        if(
          ws &&
          ws.readyState ===
          WebSocket.OPEN
        ){

          try{

            ws.send(
              JSON.stringify({
                ping:1,
                req_id:9001
              })
            );

          }catch(error){}

        }

      },
      30000
    );

}


function stopPing(){

  if(
    pingTimer
  ){

    clearInterval(
      pingTimer
    );

    pingTimer =
      null;

  }

}


/* =========================================================
   RECONNECT
   ========================================================= */

function scheduleReconnect(){

  if(
    reconnectTimer
  ){

    return;

  }


  reconnectAttempt++;


  const delay =
    Math.min(
      15000,
      1000 *
      Math.pow(
        2,
        Math.min(
          reconnectAttempt - 1,
          4
        )
      )
    );


  reconnectTimer =
    setTimeout(
      function(){

        reconnectTimer =
          null;

        connect();

      },
      delay
    );

}


/* =========================================================
   CONNECT
   ========================================================= */

function connect(){

  if(
    reconnectTimer
  ){

    clearTimeout(
      reconnectTimer
    );

    reconnectTimer =
      null;

  }


  stopPing();


  /*
    Close old connection.
  */

  if(ws){

    try{

      ws.onclose =
        null;

      ws.close();

    }catch(error){}

  }


  resetData();


  selectedSymbol =
    marketSelect.value;


  updateMarketName();


  setStatus(
    "yellow",
    "Connecting to Deriv..."
  );


  showError("");


  try{

    ws =
      new WebSocket(
        WS_URL
      );

  }catch(error){

    setStatus(
      "red",
      "Connection error"
    );


    showError(
      error.message ||
      "Could not create WebSocket."
    );


    scheduleReconnect();

    return;

  }


  /*
    SOCKET OPEN
  */

  ws.onopen =
    function(){

      reconnectAttempt =
        0;


      setStatus(
        "green",
        "Connected — loading latest 3,000 ticks..."
      );


      showError("");


      startPing();


      /*
        FIRST:
        Get exactly the latest
        3,000 historical ticks.
      */

      ws.send(
        JSON.stringify({

          ticks_history:
            selectedSymbol,

          end:
            "latest",

          count:
            MAX_HISTORY,

          style:
            "ticks",

          adjust_start_time:
            1,

          subscribe:
            0,

          req_id:
            1001

        })
      );


      /*
        SECOND:
        Subscribe to the live stream.
      */

      ws.send(
        JSON.stringify({

          ticks:
            selectedSymbol,

          subscribe:
            1,

          req_id:
            1002

        })
      );

    };


  /*
    SOCKET MESSAGE
  */

  ws.onmessage =
    handleMessage;


  /*
    SOCKET ERROR
  */

  ws.onerror =
    function(){

      setStatus(
        "red",
        "WebSocket connection error"
      );


      showError(
        "The browser could not establish the Deriv market-data connection. Retrying..."
      );

    };


  /*
    SOCKET CLOSED
  */

  ws.onclose =
    function(event){

      stopPing();


      liveSubscriptionId =
        null;


      if(
        event &&
        event.code === 1000
      ){

        setStatus(
          "yellow",
          "Connection closed"
        );

      }else{

        setStatus(
          "red",
          "Disconnected — reconnecting..."
        );


        if(
          event &&
          event.code
        ){

          showError(
            "WebSocket closed with code " +
            event.code +
            ". Retrying..."
          );

        }

      }


      scheduleReconnect();

    };

}


/* =========================================================
   MARKET CHANGE
   ========================================================= */

marketSelect.addEventListener(
  "change",
  function(){

    selectedSymbol =
      marketSelect.value;


    updateMarketName();


    reconnectAttempt =
      0;


    connect();

  }
);

    );

/* =========================================================

   ========================================================= */

selectedSymbol =

updateMarketName();


renderAll();


connect();
