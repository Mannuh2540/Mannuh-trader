<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mannuh Trader</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b12;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:12px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.connection{
  font-size:12px;
  color:#9aa4b5;
}

.status-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
  margin-right:5px;
}

.status-dot.live{
  background:#22c55e;
}

.status-dot.error{
  background:#ef4444;
}

.card{
  background:#10151f;
  border:1px solid #222c3c;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 100px;
  gap:8px;
}

select,
button{
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid #2a3547;
  background:#0b1018;
  color:white;
  font-size:14px;
}

button{
  background:#1769e0;
  border:none;
  font-weight:bold;
}

.market-name{
  font-size:18px;
  font-weight:800;
}

.market-info{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
  color:#929daf;
  font-size:12px;
}

.market-info b{
  color:white;
}

.analyzer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.title{
  font-size:17px;
  font-weight:800;
}

.window{
  width:140px;
}

.description{
  color:#8994a6;
  font-size:11px;
  margin-bottom:12px;
}

.digit-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.digit-box{
  background:#0b1018;
  border:1px solid #293445;
  border-radius:12px;
  min-height:105px;
  padding:9px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.digit-number{
  font-size:23px;
  font-weight:900;
}

.percent{
  font-size:18px;
  font-weight:800;
}

.count{
  font-size:10px;
  color:#8792a3;
}

.bar-background{
  width:100%;
  height:5px;
  background:#202938;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:#788497;
}

/* MOST */
.green{
  border:2px solid #22c55e;
  background:#0b2115;
}

.green .digit-number,
.green .percent{
  color:#22c55e;
}

.green .bar{
  background:#22c55e;
}

/* SECOND MOST */
.blue{
  border:2px solid #3b82f6;
  background:#0b1930;
}

.blue .digit-number,
.blue .percent{
  color:#60a5fa;
}

.blue .bar{
  background:#3b82f6;
}

/* SECOND LEAST */
.yellow{
  border:2px solid #eab308;
  background:#211c08;
}

.yellow .digit-number,
.yellow .percent{
  color:#facc15;
}

.yellow .bar{
  background:#eab308;
}

/* LEAST */
.red{
  border:2px solid #ef4444;
  background:#250b0e;
}

.red .digit-number,
.red .percent{
  color:#ef4444;
}

.red .bar{
  background:#ef4444;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:12px;
  color:#8994a6;
  font-size:10px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.recent{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.recent-digit{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1a2230;
  border-radius:7px;
  font-weight:bold;
  font-size:13px;
}

.recent-digit.latest{
  outline:2px solid #22c55e;
}

.message{
  color:#9aa5b6;
  font-size:12px;
  line-height:1.5;
}

.error{
  color:#f87171;
  font-size:12px;
  margin-top:9px;
  display:none;
}

@media(max-width:600px){

  .app{
    padding:8px;
  }

  .digit-grid{
    gap:5px;
  }

  .digit-box{
    min-height:92px;
    padding:7px;
  }

  .digit-number{
    font-size:20px;
  }

  .percent{
    font-size:15px;
  }

  .count{
    font-size:9px;
  }

  .controls{
    grid-template-columns:1fr 85px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">Mannuh Trader</div>

    <div class="connection">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </div>


  <!-- MARKET -->
  <div class="card">

    <div class="controls">

      <select id="market">
        <option value="1HZ100V">Volatility 100 (1s)</option>
        <option value="1HZ75V">Volatility 75 (1s)</option>
        <option value="1HZ50V">Volatility 50 (1s)</option>
        <option value="1HZ25V">Volatility 25 (1s)</option>
        <option value="1HZ10V">Volatility 10 (1s)</option>
        <option value="R_100">Volatility 100</option>
        <option value="R_75">Volatility 75</option>
        <option value="R_50">Volatility 50</option>
        <option value="R_25">Volatility 25</option>
        <option value="R_10">Volatility 10</option>
      </select>

      <button id="connect">Connect</button>

    </div>

  </div>


  <!-- LIVE MARKET -->
  <div class="card">

    <div style="font-size:11px;color:#7f8a9b;margin-bottom:4px;">
      LIVE MARKET
    </div>

    <div id="marketName" class="market-name">
      Volatility 100 (1s)
    </div>

    <div class="market-info">

      <span>
        Latest digit:
        <b id="latestDigit">—</b>
      </span>

      <span>
        Price:
        <b id="latestPrice">—</b>
      </span>

      <span>
        History:
        <b id="historyCount">0</b>
      </span>

    </div>

    <div id="error" class="error"></div>

  </div>


  <!-- THE ONE MAIN ANALYZER -->
  <div class="card">

    <div class="analyzer-head">

      <div class="title">
        DIGIT ANALYZER
      </div>

      <select id="window" class="window">

        <option value="1000" selected>
          1,000 ticks
        </option>

        <option value="1500">
          1,500 ticks
        </option>

        <option value="100">
          100 ticks
        </option>

        <option value="25">
          25 ticks
        </option>

      </select>

    </div>


    <div class="description">

      Actual digit percentages from the latest
      <b id="windowLabel">1,000</b>
      ticks.

    </div>


    <div id="digitGrid" class="digit-grid">
    </div>


    <div class="legend">

      <div class="legend-item">
        <span class="legend-dot" style="background:#22c55e"></span>
        Most appearing
      </div>

      <div class="legend-item">
        <span class="legend-dot" style="background:#3b82f6"></span>
        2nd most
      </div>

      <div class="legend-item">
        <span class="legend-dot" style="background:#eab308"></span>
        2nd least
      </div>

      <div class="legend-item">
        <span class="legend-dot" style="background:#ef4444"></span>
        Least appearing
      </div>

    </div>

  </div>


  <!-- RECENT DIGITS -->
  <div class="card">

    <div class="title" style="margin-bottom:10px;">
      RECENT DIGITS
    </div>

    <div id="recent" class="recent"></div>

  </div>


</div>


<script>

/* =========================================================
   MANNuh TRADER
   EXACT ROLLING DIGIT ANALYZER
   ========================================================= */

const WS_URL =
"wss://api.derivws.com/trading/v1/options/ws/public";

const HISTORY_SIZE = 1500;

let socket = null;

let allDigits = [];
let allPrices = [];

let currentSymbol = "1HZ100V";

let decimals = 2;


/* =========================================================
   MARKET NAMES
   ========================================================= */

const marketNames = {

  "1HZ100V":"Volatility 100 (1s)",
  "1HZ75V":"Volatility 75 (1s)",
  "1HZ50V":"Volatility 50 (1s)",
  "1HZ25V":"Volatility 25 (1s)",
  "1HZ10V":"Volatility 10 (1s)",

  "R_100":"Volatility 100",
  "R_75":"Volatility 75",
  "R_50":"Volatility 50",
  "R_25":"Volatility 25",
  "R_10":"Volatility 10"

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const market =
document.getElementById("market");

const connectButton =
document.getElementById("connect");

const windowSelect =
document.getElementById("window");

const digitGrid =
document.getElementById("digitGrid");

const recent =
document.getElementById("recent");

const latestDigit =
document.getElementById("latestDigit");

const latestPrice =
document.getElementById("latestPrice");

const historyCount =
document.getElementById("historyCount");

const marketName =
document.getElementById("marketName");

const statusText =
document.getElementById("statusText");

const statusDot =
document.getElementById("statusDot");

const errorBox =
document.getElementById("error");


/* =========================================================
   STATUS
   ========================================================= */

function status(text,type){

  statusText.textContent = text;

  statusDot.className =
  "status-dot " + type;

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message){

  if(!message){

    errorBox.style.display = "none";
    errorBox.textContent = "";

    return;
  }

  errorBox.textContent = message;

  errorBox.style.display = "block";

}


/* =========================================================
   DECIMAL PLACES
   ========================================================= */

function getDecimals(pip){

  const number = Number(pip);

  if(!Number.isFinite(number) || number <= 0){
    return decimals;
  }

  const text = String(number);

  if(text.includes("e-")){

    return Number(
      text.split("e-")[1]
    );

  }

  if(text.includes(".")){

    return text.split(".")[1].length;

  }

  return 0;

}


/* =========================================================
   GET LAST DIGIT
   ========================================================= */

function getLastDigit(price){

  const formatted =
  Number(price).toFixed(decimals);

  const digitsOnly =
  formatted.replace(/\D/g,"");

  return Number(
    digitsOnly.charAt(
      digitsOnly.length - 1
    )
  );

}


/* =========================================================
   RESET
   ========================================================= */

function reset(){

  allDigits = [];
  allPrices = [];

  latestDigit.textContent = "—";
  latestPrice.textContent = "—";
  historyCount.textContent = "0";

  recent.innerHTML = "";

  createEmptyGrid();

}


/* =========================================================
   EMPTY GRID
   ========================================================= */

function createEmptyGrid(){

  digitGrid.innerHTML = "";

  for(let d=0;d<=9;d++){

    const box =
    document.createElement("div");

    box.className = "digit-box";

    box.innerHTML = `

      <div class="digit-number">
        ${d}
      </div>

      <div class="percent">
        0.0%
      </div>

      <div class="count">
        0 / 0
      </div>

      <div class="bar-background">
        <div class="bar"></div>
      </div>

    `;

    digitGrid.appendChild(box);

  }

}


/* =========================================================
   CONNECT
   ========================================================= */

function connect(){

  if(socket){

    try{
      socket.close();
    }catch(e){}

  }

  currentSymbol =
  market.value;

  marketName.textContent =
  marketNames[currentSymbol] ||
  currentSymbol;

  showError("");

  reset();

  status("Connecting...","");

  socket =
  new WebSocket(WS_URL);


  socket.onopen = function(){

    status("Loading history...","live");

    /*
      FIRST:
      Load the latest 1,500 ticks.

      The default display only uses
      the latest 1,000 of these.
    */

    socket.send(
      JSON.stringify({

        ticks_history:
        currentSymbol,

        end:"latest",

        style:"ticks",

        count:HISTORY_SIZE,

        subscribe:0,

        req_id:1

      })
    );

  };


  socket.onmessage =
  function(event){

    let data;

    try{

      data =
      JSON.parse(event.data);

    }catch(error){

      return;

    }


    /* ERROR FROM DERIV */

    if(data.error){

      status("Error","error");

      showError(
        data.error.message ||
        "Deriv rejected the request."
      );

      return;

    }


    /* HISTORICAL TICKS */

    if(data.msg_type === "history"){

      loadHistory(data);

      return;

    }


    /* LIVE TICK */

    if(data.msg_type === "tick"){

      processLiveTick(data);

      return;

    }

  };


  socket.onerror =
  function(){

    status(
      "Connection error",
      "error"
    );

    showError(
      "The WebSocket connection failed."
    );

  };


  socket.onclose =
  function(){

    status(
      "Disconnected",
      "error"
    );

  };

}


/* =========================================================
   LOAD HISTORY
   ========================================================= */

function loadHistory(data){

  if(!data.history ||
     !Array.isArray(data.history.prices)){

    status("Error","error");

    showError(
      "Deriv did not return historical ticks."
    );

    return;

  }


  /*
    IMPORTANT:

    pip_size is in the RESPONSE,
    not inside data.history.
  */

  if(data.pip_size !== undefined){

    decimals =
    getDecimals(data.pip_size);

  }


  const prices =
  data.history.prices;


  allDigits = [];
  allPrices = [];


  for(let i=0;i<prices.length;i++){

    const price =
    Number(prices[i]);

    if(!Number.isFinite(price)){
      continue;
    }

    allPrices.push(price);

    allDigits.push(
      getLastDigit(price)
    );

  }


  /*
    Keep enough history for the selector,
    but never let it grow forever.
  */

  if(allDigits.length > HISTORY_SIZE){

    allDigits =
    allDigits.slice(-HISTORY_SIZE);

    allPrices =
    allPrices.slice(-HISTORY_SIZE);

  }


  /*
    THIS IS THE IMPORTANT PART:

    The screen is now already populated
    from REAL historical ticks.

    It does NOT start counting from zero.
  */

  updateEverything();


  status("LIVE","live");


  /*
    NOW start the live stream.
  */

  socket.send(
    JSON.stringify({

      ticks:
      currentSymbol,

      subscribe:1,

      req_id:2

    })
  );

}


/* =========================================================
   LIVE TICK
   ========================================================= */

function processLiveTick(data){

  if(!data.tick ||
     data.tick.quote === undefined){

    return;

  }


  if(data.tick.pip_size !== undefined){

    decimals =
    getDecimals(data.tick.pip_size);

  }


  const price =
  Number(data.tick.quote);


  if(!Number.isFinite(price)){
    return;
  }


  const digit =
  getLastDigit(price);


  /*
    EXACT ROLLING HISTORY:

    ADD NEWEST
  */

  allPrices.push(price);
  allDigits.push(digit);


  /*
    REMOVE OLDEST

    Therefore the history stays at
    exactly 1,500 ticks after loading
    enough historical data.
  */

  if(allDigits.length > HISTORY_SIZE){

    allDigits.shift();
    allPrices.shift();

  }


  latestDigit.textContent =
  digit;

  latestPrice.textContent =
  price.toFixed(decimals);

  historyCount.textContent =
  allDigits.length.toLocaleString();


  /*
    Recalculate the display
    after EVERY new tick.
  */

  updateEverything();

}


/* =========================================================
   CURRENT WINDOW
   ========================================================= */

function getCurrentWindow(){

  const size =
  Number(windowSelect.value);

  return allDigits.slice(-size);

}


/* =========================================================
   DRAW MAIN 0-9 ANALYZER
   ========================================================= */

function drawAnalyzer(){

  const windowData =
  getCurrentWindow();

  const total =
  windowData.length;


  document.getElementById(
    "windowLabel"
  ).textContent =
  Number(windowSelect.value)
  .toLocaleString();


  /*
    COUNT EVERY DIGIT
  */

  const counts =
  Array(10).fill(0);


  for(const digit of windowData){

    if(digit >= 0 && digit <= 9){

      counts[digit]++;

    }

  }


  /*
    HIGHEST
  */

  const rankedHigh =
  Array.from(
    {length:10},
    (_,digit)=>digit
  ).sort(
    (a,b)=>
    counts[b] -
    counts[a] ||
    a-b
  );


  /*
    LOWEST
  */

  const rankedLow =
  Array.from(
    {length:10},
    (_,digit)=>digit
  ).sort(
    (a,b)=>
    counts[a] -
    counts[b] ||
    a-b
  );


  const highest =
  rankedHigh[0];

  const secondHighest =
  rankedHigh[1];

  const lowest =
  rankedLow[0];

  const secondLowest =
  rankedLow[1];


  digitGrid.innerHTML = "";


  /*
    CREATE 0 TO 9
  */

  for(let digit=0;digit<=9;digit++){

    const count =
    counts[digit];


    const percent =
    total > 0
    ? (count / total) * 100
    : 0;


    let colorClass = "";


    if(digit === highest){

      colorClass = "green";

    }
    else if(digit === secondHighest){

      colorClass = "blue";

    }
    else if(digit === lowest){

      colorClass = "red";

    }
    else if(digit === secondLowest){

      colorClass = "yellow";

    }


    const box =
    document.createElement("div");


    box.className =
    "digit-box " +
    colorClass;


    box.innerHTML = `

      <div class="digit-number">
        ${digit}
      </div>

      <div class="percent">
        ${percent.toFixed(1)}%
      </div>

      <div class="count">
        ${count} / ${total}
      </div>

      <div class="bar-background">
        <div
          class="bar"
          style="width:${Math.min(percent,100)}%"
        ></div>
      </div>

    `;


    digitGrid.appendChild(box);

  }

}


/* =========================================================
   RECENT DIGITS
   ========================================================= */

function drawRecentDigits(){

  /*
    ONLY SHOW THE LAST 20
    ON THE SCREEN.

    They are still taken from the
    same rolling history.
  */

  const recentDigits =
  allDigits.slice(-20);


  recent.innerHTML = "";


  recentDigits.forEach(
    (digit,index)=>{

      const item =
      document.createElement("div");


      item.className =
      "recent-digit";


      if(index ===
         recentDigits.length - 1){

        item.classList.add("latest");

      }


      item.textContent =
      digit;


      recent.appendChild(item);

    }
  );

}


/* =========================================================
   UPDATE EVERYTHING
   ========================================================= */

function updateEverything(){

  historyCount.textContent =
  allDigits.length.toLocaleString();


  drawAnalyzer();


  drawRecentDigits();

}


/* =========================================================
   WINDOW CHANGED
   ========================================================= */

windowSelect.addEventListener(
  "change",
  function(){

    /*
      IMPORTANT:

      Changing the selector does NOT
      start counting again.

      It simply takes a different
      slice of the already loaded
      rolling history.
    */

    updateEverything();

  }
);


/* =========================================================
   MARKET CHANGED
   ========================================================= */

market.addEventListener(
  "change",
  function(){

    connect();

  }
);


/* =========================================================
   CONNECT BUTTON
   ========================================================= */

connectButton.addEventListener(
  "click",
  function(){

    connect();

  }
);


/* =========================================================
   START
   ========================================================= */

createEmptyGrid();

connect();

</script>

</body>
</html>
