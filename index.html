<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mannuh Trader</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f14;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

h1 {
    margin: 0 0 15px;
    font-size: 28px;
}

.panel {
    background: #121820;
    border: 1px solid #26313d;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

label {
    display: block;
    color: #9aa7b4;
    font-size: 13px;
    margin-bottom: 6px;
}

select,
button {
    border: 1px solid #33404d;
    background: #1a222c;
    color: #ffffff;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 14px;
}

select {
    width: 100%;
}

button {
    cursor: pointer;
}

button:hover {
    background: #26313d;
}

.mode-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.mode-btn.active {
    background: #ffffff;
    color: #000000;
}

.status-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.stat {
    background: #0d131a;
    border-radius: 8px;
    padding: 10px;
}

.stat-title {
    color: #8995a2;
    font-size: 12px;
}

.stat-value {
    font-size: 17px;
    margin-top: 5px;
    font-weight: bold;
}

.analyzer-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.analyzer-title h2 {
    margin: 0;
    font-size: 19px;
}

.bars {
    display: flex;
    align-items: flex-end;
    gap: 7px;
    height: 260px;
    padding: 10px 5px 0;
}

.bar-column {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    min-width: 0;
}

.bar-value {
    font-size: 12px;
    margin-bottom: 5px;
    white-space: nowrap;
}

.bar {
    width: 100%;
    max-width: 60px;
    min-height: 2px;
    border-radius: 5px 5px 0 0;
}

.digit-label {
    margin-top: 7px;
    font-weight: bold;
}

.green {
    background: #16c784;
}

.blue {
    background: #3b82f6;
}

.red {
    background: #ef4444;
}

.yellow {
    background: #eab308;
}

.recent-title {
    margin-bottom: 10px;
    font-size: 18px;
}

.recent-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 7px;
}

.recent-digit {
    height: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 7px;
    font-weight: bold;
    background: #1a222c;
}

.recent-digit.target {
    background: #ef4444;
}

.recent-digit.safe {
    background: #16c784;
}

.small {
    color: #8995a2;
    font-size: 12px;
}

.connection {
    font-weight: bold;
}

.connected {
    color: #16c784;
}

.disconnected {
    color: #ef4444;
}

.waiting {
    color: #eab308;
}

@media (max-width: 700px) {
    .status-row {
        grid-template-columns: repeat(2, 1fr);
    }

    .bars {
        height: 220px;
        gap: 3px;
    }

    .bar-value {
        font-size: 10px;
    }

    .recent-grid {
        grid-template-columns: repeat(8, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Mannuh Trader</h1>

    <div class="panel">
        <label for="market">Market</label>

        <select id="market">
            <option value="1HZ10V">Volatility 10 (1s)</option>
            <option value="1HZ25V">Volatility 25 (1s)</option>
            <option value="1HZ50V">Volatility 50 (1s)</option>
            <option value="1HZ75V">Volatility 75 (1s)</option>
            <option value="1HZ100V" selected>Volatility 100 (1s)</option>

            <option value="R_10">Volatility 10</option>
            <option value="R_25">Volatility 25</option>
            <option value="R_50">Volatility 50</option>
            <option value="R_75">Volatility 75</option>
            <option value="R_100">Volatility 100</option>
        </select>
    </div>

    <div class="panel">

        <div class="status-row">

            <div class="stat">
                <div class="stat-title">Connection</div>
                <div id="connection" class="stat-value connection waiting">
                    Connecting...
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">Stored ticks</div>
                <div id="stored" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Price</div>
                <div id="price" class="stat-value">---</div>
            </div>

            <div class="stat">
                <div class="stat-title">Last digit</div>
                <div id="lastDigit" class="stat-value">---</div>
            </div>

        </div>

    </div>

    <div class="panel">

        <div class="small" style="margin-bottom:10px;">
            Active analysis mode
        </div>

        <div class="mode-buttons">

            <button
                id="over2Btn"
                class="mode-btn active"
                onclick="setMode('over2')">
                OVER 2
            </button>

            <button
                id="under7Btn"
                class="mode-btn"
                onclick="setMode('under7')">
                UNDER 7
            </button>

        </div>

    </div>

    <div class="panel">

        <div class="analyzer-title">
            <h2>1,000 Tick Analyzer</h2>
            <span class="small">Rolling 1,000 ticks</span>
        </div>

        <div id="bars1000" class="bars"></div>

    </div>

    <div class="panel">

        <div class="analyzer-title">
            <h2>100 Tick Analyzer</h2>
            <span class="small">Rolling 100 ticks</span>
        </div>

        <div id="bars100" class="bars"></div>

    </div>

    <div class="panel">

        <div class="recent-title">
            Recent Digits
        </div>

        <div class="small" style="margin-bottom:10px;">
            Newest digit is on the left
        </div>

        <div id="recentDigits" class="recent-grid"></div>

    </div>

</div>

<script>

/* =========================================================
   MANNuh TRADER
   ========================================================= */

const WS_URL =
    "wss://api.derivws.com/trading/v1/options/ws/public";

const MAX_HISTORY = 3000;
const WINDOW_1000 = 1000;
const WINDOW_100 = 100;
const RECENT_COUNT = 72;

let ws = null;

let selectedSymbol =
    document.getElementById("market").value;

let mode = "over2";

let tickHistory = [];

let pendingTicks = [];

let lastHistoryEpoch = 0;

let reconnectTimer = null;

let reconnectDelay = 1000;

let pingTimer = null;

let historyLoaded = false;

let pipSize = 2;


/* =========================================================
   MARKET CHANGE
   ========================================================= */

document
    .getElementById("market")
    .addEventListener("change", function () {

        selectedSymbol = this.value;

        resetAnalyzer();

        connect();

    });


/* =========================================================
   MODE
   ========================================================= */

function setMode(newMode) {

    mode = newMode;

    document
        .getElementById("over2Btn")
        .classList.toggle(
            "active",
            mode === "over2"
        );

    document
        .getElementById("under7Btn")
        .classList.toggle(
            "active",
            mode === "under7"
        );

    renderRecent();

    renderAnalyzer(
        tickHistory.slice(-WINDOW_1000),
        "bars1000"
    );

    renderAnalyzer(
        tickHistory.slice(-WINDOW_100),
        "bars100"
    );
}


/* =========================================================
   RESET
   ========================================================= */

function resetAnalyzer() {

    tickHistory = [];

    pendingTicks = [];

    lastHistoryEpoch = 0;

    historyLoaded = false;

    document.getElementById("stored").textContent = "0";

    document.getElementById("price").textContent = "---";

    document.getElementById("lastDigit").textContent = "---";

    document.getElementById("bars1000").innerHTML = "";

    document.getElementById("bars100").innerHTML = "";

    document.getElementById("recentDigits").innerHTML = "";
}


/* =========================================================
   CONNECTION
   ========================================================= */

function connect() {

    if (reconnectTimer) {

        clearTimeout(reconnectTimer);

        reconnectTimer = null;
    }

    if (ws) {

        try {
            ws.close();
        } catch (e) {}

        ws = null;
    }

    historyLoaded = false;

    setConnection(
        "Connecting...",
        "waiting"
    );

    try {

        ws = new WebSocket(WS_URL);

    } catch (error) {

        setConnection(
            "Connection error",
            "disconnected"
        );

        scheduleReconnect();

        return;
    }


    ws.onopen = function () {

        reconnectDelay = 1000;

        setConnection(
            "Connected",
            "connected"
        );

        startPing();

        requestActiveSymbols();

    };


    ws.onmessage = function (event) {

        let data;

        try {

            data = JSON.parse(event.data);

        } catch (error) {

            return;
        }

        handleMessage(data);

    };


    ws.onerror = function () {

        setConnection(
            "Connection error",
            "disconnected"
        );

    };


    ws.onclose = function () {

        stopPing();

        setConnection(
            "Disconnected",
            "disconnected"
        );

        scheduleReconnect();

    };
}


/* =========================================================
   ACTIVE SYMBOLS
   ========================================================= */

function requestActiveSymbols() {

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        return;
    }

    ws.send(
        JSON.stringify({
            active_symbols: "brief",
            req_id: 1
        })
    );
}


/* =========================================================
   HISTORY
   ========================================================= */

function requestHistory() {

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        return;
    }

    setConnection(
        "Loading history...",
        "waiting"
    );

    ws.send(
        JSON.stringify({

            ticks_history: selectedSymbol,

            count: MAX_HISTORY,

            end: "latest",

            style: "ticks",

            subscribe: 0,

            req_id: 1001

        })
    );
}


/* =========================================================
   LIVE SUBSCRIPTION
   ========================================================= */

function subscribeTicks() {

    if (!ws || ws.readyState !== WebSocket.OPEN) {
        return;
    }

    ws.send(
        JSON.stringify({

            ticks: selectedSymbol,

            subscribe: 1,

            req_id: 1002

        })
    );
}


/* =========================================================
   MESSAGE HANDLER
   ========================================================= */

function handleMessage(data) {

    if (data.error) {

        console.error(
            "Deriv error:",
            data.error
        );

        setConnection(
            data.error.message || "API error",
            "disconnected"
        );

        return;
    }


    if (data.msg_type === "active_symbols") {

        requestHistory();

        return;
    }


    if (data.msg_type === "history") {

        processHistory(data);

        return;
    }


    if (data.msg_type === "tick") {

        processLiveTick(data);

        return;
    }

}


/* =========================================================
   PROCESS HISTORY
   ========================================================= */

function processHistory(data) {

    if (!data.history) {

        setConnection(
            "No history received",
            "disconnected"
        );

        return;
    }


    const prices = data.history.prices || [];

    const times = data.history.times || [];


    if (!prices.length) {

        setConnection(
            "No ticks received",
            "disconnected"
        );

        return;
    }


    tickHistory = [];


    for (
        let i = 0;
        i < prices.length;
        i++
    ) {

        const price = Number(prices[i]);

        const epoch =
            Number(times[i] || 0);

        if (!Number.isFinite(price)) {
            continue;
        }

        tickHistory.push({

            price: price,

            epoch: epoch,

            digit: getLastDigit(
                price,
                pipSize
            )

        });

    }


    if (tickHistory.length > MAX_HISTORY) {

        tickHistory =
            tickHistory.slice(-MAX_HISTORY);

    }


    if (tickHistory.length) {

        lastHistoryEpoch =
            tickHistory[tickHistory.length - 1].epoch;

        const latest =
            tickHistory[tickHistory.length - 1];

        updatePriceDisplay(latest);

    }


    historyLoaded = true;


    renderAll();


    setConnection(
        "Live",
        "connected"
    );


    /*
       Apply any live ticks that arrived while
       the historical data was loading.
    */

    if (pendingTicks.length) {

        const queued =
            pendingTicks.slice();

        pendingTicks = [];

        queued.forEach(function (tick) {

            processLiveTick({
                tick: tick
            });

        });

    }


    subscribeTicks();

}


/* =========================================================
   PROCESS LIVE TICK
   ========================================================= */

function processLiveTick(data) {

    if (!data.tick) {
        return;
    }


    const tick = data.tick;


    const symbol =
        tick.symbol || selectedSymbol;


    if (symbol !== selectedSymbol) {
        return;
    }


    const price = Number(tick.quote);


    if (!Number.isFinite(price)) {
        return;
    }


    const epoch =
        Number(tick.epoch || 0);


    if (!historyLoaded) {

        pendingTicks.push(tick);

        return;
    }


    if (
        epoch &&
        lastHistoryEpoch &&
        epoch < lastHistoryEpoch
    ) {

        return;
    }


    if (tick.pip_size !== undefined) {

        const detectedPip =
            Number(tick.pip_size);

        if (
            Number.isFinite(detectedPip) &&
            detectedPip >= 0
        ) {

            pipSize = detectedPip;

        }

    }


    const digit =
        getLastDigit(
            price,
            pipSize
        );


    const item = {

        price: price,

        epoch: epoch,

        digit: digit

    };


    tickHistory.push(item);


    if (epoch) {
        lastHistoryEpoch = epoch;
    }


    if (tickHistory.length > MAX_HISTORY) {

        tickHistory.shift();

    }


    updatePriceDisplay(item);

    renderAll();

}


/* =========================================================
   LAST DIGIT
   ========================================================= */

function getLastDigit(price, decimals) {

    let fixed;

    try {

        fixed =
            Number(price).toFixed(decimals);

    } catch (error) {

        fixed =
            String(price);
    }


    const digits =
        fixed.replace(
            /[^0-9]/g,
            ""
        );


    if (!digits.length) {
        return 0;
    }


    return Number(
        digits.charAt(
            digits.length - 1
        )
    );

}


/* =========================================================
   PRICE DISPLAY
   ========================================================= */

function updatePriceDisplay(item) {

    document.getElementById(
        "price"
    ).textContent =
        Number(item.price).toFixed(
            pipSize
        );


    document.getElementById(
        "lastDigit"
    ).textContent =
        item.digit;

}


/* =========================================================
   RENDER ALL
   ========================================================= */

function renderAll() {

    document.getElementById(
        "stored"
    ).textContent =
        tickHistory.length.toLocaleString();


    renderAnalyzer(
        tickHistory.slice(-WINDOW_1000),
        "bars1000"
    );


    renderAnalyzer(
        tickHistory.slice(-WINDOW_100),
        "bars100"
    );


    renderRecent();

}


/* =========================================================
   COUNT DIGITS
   ========================================================= */

function countDigits(ticks) {

    const counts =
        Array(10).fill(0);


    ticks.forEach(function (tick) {

        const d =
            Number(tick.digit);

        if (
            Number.isInteger(d) &&
            d >= 0 &&
            d <= 9
        ) {

            counts[d]++;

        }

    });


    return counts;

}


/* =========================================================
   BAR CLASS
   ========================================================= */

function getRankingClasses(counts) {

    const indexes =
        Array.from(
            {
                length: 10
            },
            (_, i) => i
        );


    indexes.sort(
        (a, b) =>
            counts[a] - counts[b]
    );


    const classes =
        Array(10).fill("");


    const least =
        indexes[0];

    const secondLeast =
        indexes[1];

    const most =
        indexes[9];

    const secondMost =
        indexes[8];


    classes[most] = "green";

    classes[secondMost] = "blue";

    classes[least] = "red";

    classes[secondLeast] = "yellow";


    return classes;

}


/* =========================================================
   ANALYZER
   ========================================================= */

function renderAnalyzer(
    ticks,
    elementId
) {

    const container =
        document.getElementById(
            elementId
        );


    if (!ticks.length) {

        container.innerHTML = "";

        return;
    }


    const counts =
        countDigits(ticks);


    const classes =
        getRankingClasses(counts);


    const total =
        ticks.length;


    const maxCount =
        Math.max(
            ...counts,
            1
        );


    container.innerHTML = "";


    for (
        let digit = 0;
        digit <= 9;
        digit++
    ) {

        const count =
            counts[digit];


        const percent =
            total
                ? (count / total) * 100
                : 0;


        const height =
            (count / maxCount) * 100;


        const column =
            document.createElement(
                "div"
            );

        column.className =
            "bar-column";


        const value =
            document.createElement(
                "div"
            );

        value.className =
            "bar-value";

        value.textContent =
            percent.toFixed(1) + "%";


        const bar =
            document.createElement(
                "div"
            );

        bar.className =
            "bar " + classes[digit];


        bar.style.height =
            Math.max(
                height,
                1
            ) + "%";


        const label =
            document.createElement(
                "div"
            );

        label.className =
            "digit-label";

        label.textContent =
            digit;


        column.appendChild(value);

        column.appendChild(bar);

        column.appendChild(label);

        container.appendChild(column);

    }

}


/* =========================================================
   RECENT DIGITS
   ========================================================= */

function renderRecent() {

    const container =
        document.getElementById(
            "recentDigits"
        );


    container.innerHTML = "";


    const recent =
        tickHistory
            .slice(-RECENT_COUNT)
            .reverse();


    recent.forEach(function (tick) {

        const digit =
            Number(tick.digit);


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "recent-digit";


        const isOverTarget =
            mode === "over2" &&
            digit <= 2;


        const isUnderTarget =
            mode === "under7" &&
            digit >= 7;


        if (
            isOverTarget ||
            isUnderTarget
        ) {

            item.classList.add(
                "target"
            );

        } else {

            item.classList.add(
                "safe"
            );

        }


        item.textContent =
            digit;


        container.appendChild(item);

    });

}


/* =========================================================
   CONNECTION DISPLAY
   ========================================================= */

function setConnection(
    text,
    state
) {

    const element =
        document.getElementById(
            "connection"
        );


    element.textContent =
        text;


    element.className =
        "stat-value connection " +
        state;

}


/* =========================================================
   RECONNECT
   ========================================================= */

function scheduleReconnect() {

    if (reconnectTimer) {
        return;
    }


    reconnectTimer =
        setTimeout(
            function () {

                reconnectTimer = null;

                connect();

                reconnectDelay =
                    Math.min(
                        reconnectDelay * 2,
                        15000
                    );

            },
            reconnectDelay
        );

}


/* =========================================================
   PING
   ========================================================= */

function startPing() {

    stopPing();


    pingTimer =
        setInterval(
            function () {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    try {

                        ws.send(
                            JSON.stringify({
                                ping: 1
                            })
                        );

                    } catch (error) {}

                }

            },
            12000
        );

}


/* =========================================================
   STOP PING
   ========================================================= */

function stopPing() {

    if (pingTimer) {

        clearInterval(
            pingTimer
        );

        pingTimer = null;

    }

}


/* =========================================================
   START
   ========================================================= */

connect();

</script>

</body>
</html>
